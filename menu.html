<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>

<body>

    <div class="container">
        <!-- Navigation Header matching the interface mockup -->
        <header class="app-header nav-header">
            <button class="back-btn" onclick="window.location.href='index.html'">⬅</button>
            <h1>Select Items</h1>
        </header>

        <!-- Time slot category scroll tabs -->
        

        <!-- Target injection container wrapper for script.js row modules -->
        <main id="menuItems" class="items-list-wrapper"></main>

        <!-- Fixed bottom view controller footer matrix -->
        <footer class="sticky-footer">
            <button id="viewCartBtn" class="footer-action-btn" onclick="goToCart()">View Cart (0) - ₹0</button>
        </footer>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
